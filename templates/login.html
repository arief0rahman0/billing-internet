<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Login - Sistem Pembayaran Internet</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="/static/Logo1.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Logo1.png') }}">
    <script>
        // Set initial theme immediately with error handling
        (function() {
            try {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                    document.body.classList.add('dark'); // Fallback support
                    // Force initial dark mode styles
                    document.body.style.backgroundColor = '#0b0f19';
                    document.body.style.color = '#f1f5f9';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.classList.remove('dark'); // Fallback support
                    // Force initial light mode styles
                    document.body.style.backgroundColor = '#f8fafc';
                    document.body.style.color = '#1e293b';
                }
                console.log('Theme initialized:', savedTheme || 'system preference (' + prefersDark + ')');
            } catch (e) {
                console.error('Error initializing theme:', e);
                // Fallback to system preference if localStorage fails
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    document.documentElement.classList.add('dark');
                    document.body.classList.add('dark'); // Fallback support
                    // Force initial dark mode styles
                    document.body.style.backgroundColor = '#0b0f19';
                    document.body.style.color = '#f1f5f9';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.classList.remove('dark'); // Fallback support
                    // Force initial light mode styles
                    document.body.style.backgroundColor = '#f8fafc';
                    document.body.style.color = '#1e293b';
                }
            }
        })();
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Logo quality optimization */
        .logo-image {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.6s ease-in-out;
        }
    
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        /* Mobile touch improvements */
        @media (max-width: 640px) {
            * {
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
            }
            input, button {
                -webkit-appearance: none;
                border-radius: 12px;
            }
            button {
                touch-action: manipulation;
            }
        }

        /* DARK MODE FALLBACK STYLING - Works without Tailwind */
        :root {
            --bg-light: #f8fafc;
            --bg-dark: #0b0f19;
            --text-light: #1e293b;
            --text-dark: #f1f5f9;
            --card-light: rgba(255, 255, 255, 0.8);
            --card-dark: rgba(15, 23, 42, 0.6);
            --border-light: rgba(226, 232, 240, 0.5);
            --border-dark: rgba(51, 65, 85, 0.5);
            --input-light: #f8fafc;
            --input-dark: #0f172a;
            --input-border-light: #e2e8f0;
            --input-border-dark: #1e293b;
            --placeholder-light: #94a3b8;
            --placeholder-dark: #64748b;
            --button-bg: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-light);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        /* Dark mode for card container */
        .dark-mode-card {
            background: var(--card-light);
            border: 1px solid var(--border-light);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        body.dark .dark-mode-card {
            background: var(--card-dark);
            border-color: var(--border-dark);
        }

        /* Dark mode for form inputs */
        .dark-mode-input {
            background-color: var(--input-light);
            border: 1px solid var(--input-border-light);
            color: var(--text-light);
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body.dark .dark-mode-input {
            background-color: var(--input-dark);
            border-color: var(--input-border-dark);
            color: var(--text-dark);
        }

        body.dark .dark-mode-input::placeholder {
            color: var(--placeholder-dark);
        }

        /* Dark mode for labels */
        .dark-mode-label {
            color: var(--placeholder-light);
            transition: color 0.3s ease;
        }

        body.dark .dark-mode-label {
            color: var(--placeholder-dark);
        }

        /* Dark mode for theme toggle button */
        .dark-mode-toggle {
            background: white;
            border: 1px solid var(--input-border-light);
            color: var(--text-light);
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body.dark .dark-mode-toggle {
            background: #0f172a;
            border-color: var(--input-border-dark);
            color: var(--text-dark);
        }

        /* Dark mode for error messages */
        .dark-mode-error {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body.dark .dark-mode-error {
            background: rgba(127, 29, 29, 0.3);
            border-color: rgba(127, 29, 29, 0.5);
            color: #fca5a5;
        }

        /* Dark mode for logo container */
        .dark-mode-logo {
            background: linear-gradient(135deg, #eef2ff 0%, #ffffff 100%);
            border: 1px solid #e0e7ff;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        body.dark .dark-mode-logo {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.2) 0%, rgba(168, 85, 247, 0.1) 100%);
            border-color: rgba(79, 70, 229, 0.2);
        }

        /* Force dark mode when Tailwind fails */
        .no-tailwind .dark-mode-card,
        .no-tailwind.dark .dark-mode-card {
            background: var(--card-dark);
            border-color: var(--border-dark);
        }

        .no-tailwind.dark body,
        body.dark.no-tailwind {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }
        
        /* Fallback styling if Tailwind CSS fails to load */
        .fallback-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            padding: 16px;
        }
        @media (min-width: 640px) {
            .fallback-container {
                padding: 20px;
            }
        }
        .fallback-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 24px;
            max-width: 400px;
            width: 100%;
        }
        @media (min-width: 640px) {
            .fallback-card {
                padding: 40px;
            }
        }
        .fallback-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .fallback-logo img {
            height: 56px;
            margin: 0 auto;
        }
        .fallback-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .fallback-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            min-height: 44px;
        }
        @media (min-width: 640px) {
            .fallback-input {
                font-size: 14px;
            }
        }
        .fallback-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            min-height: 48px;
        }
        @media (min-width: 640px) {
            .fallback-button {
                padding: 12px;
                font-size: 14px;
                min-height: auto;
            }
        }
        .fallback-button:hover {
            opacity: 0.9;
        }
        .fallback-label {
            display: block;
            font-size: 10px;
            font-weight: bold;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .fallback-error {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="bg-[#f8fafc] dark:bg-[#0b0f19] text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-4 lg:p-6 relative overflow-hidden transition-colors duration-300 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-100/40 via-purple-50/20 to-white dark:from-indigo-900/20 dark:via-[#0b0f19] dark:to-[#0b0f19] animate-fade-in-up" id="app-body" style="transition: background-color 0.3s ease, color 0.3s ease;">

    <!-- Theme Toggle Floating Button -->
    <button onclick="toggleTheme()" class="absolute top-4 right-4 sm:top-6 sm:right-6 p-3 sm:p-3 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-md hover:shadow-lg transition-all duration-300 hover:scale-105 cursor-pointer z-50 text-slate-600 dark:text-slate-300 relative z-[100] active:scale-95 dark-mode-toggle" aria-label="Toggle Theme">
        <!-- Sun icon (visible in dark) -->
        <svg id="sun-icon" class="pointer-events-none w-4 h-4 sm:w-4 sm:h-4 hidden dark:block text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
        </svg>
        <!-- Moon icon (visible in light) -->
        <svg id="moon-icon" class="pointer-events-none w-4 h-4 sm:w-4 sm:h-4 block dark:hidden text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
    </button>

    <div class="w-full max-w-md sm:max-w-lg lg:max-w-md bg-white/80 dark:bg-slate-900/60 backdrop-blur-xl rounded-2xl shadow-2xl shadow-indigo-500/10 dark:shadow-none border border-slate-200/50 dark:border-slate-800/50 overflow-hidden transition-all duration-300 z-10 dark-mode-card">
        <div class="p-6 sm:p-8 lg:p-10 space-y-5 sm:space-y-7">
            
            <!-- Logo Section -->
            <div class="text-center space-y-3 sm:space-y-3">
                <div class="flex justify-center select-none">
                    <div class="p-3 sm:p-4 bg-gradient-to-br from-indigo-50 to-white dark:from-indigo-500/20 dark:to-purple-500/10 rounded-2xl border border-indigo-100/50 dark:border-indigo-500/20 shadow-inner dark-mode-logo">
                        <img src="{{ url_for('static', filename='Logo1.png') }}" alt="Logo" class="h-16 sm:h-20 w-auto object-contain max-w-[200px] sm:max-w-[250px] logo-image">
                    </div>
                </div>
                <div class="space-y-1">
                    <!-- Removed title -->
                </div>
            </div>

            <!-- Flash Error Message -->
            {% if error %}
            <div class="p-3 sm:p-3.5 bg-slate-100 dark:bg-slate-900 border border-rose-500/20 text-slate-800 dark:text-rose-400 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-2.5 animate-shake dark-mode-error">
                <span class="w-2 h-2 rounded-full bg-rose-500 shrink-0"></span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="/login" class="space-y-4 sm:space-y-4" onsubmit="const btn = this.querySelector('button[type=submit]'); btn.disabled = true; btn.innerHTML = 'Memproses...';">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <!-- Honeypot field (anti-bot) -->
                <div style="display:none;" aria-hidden="true">
                    <input type="text" name="hp_field" tabindex="-1" autocomplete="off">
                </div>
                <!-- Username -->
                <div class="space-y-1.5 sm:space-y-1">
                    <label class="block text-[10px] sm:text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider dark-mode-label">Username</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 sm:pl-3.5 pointer-events-none text-slate-400 group-focus-within:text-slate-900 dark:group-focus-within:text-white transition-colors">
                            <svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </span>
                        <input type="text" name="username" required placeholder="Username" autocomplete="username"
                               class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl py-3 sm:py-2.5 pl-10 sm:pl-10 pr-3.5 sm:pr-3.5 text-sm sm:text-xs focus:outline-none focus:ring-2 focus:ring-slate-400 dark:focus:ring-slate-700 focus:border-slate-400 dark:focus:border-slate-700 transition-all placeholder-slate-400 dark:placeholder-slate-600 min-h-[44px] sm:min-h-[auto] dark-mode-input">
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-1.5 sm:space-y-1">
                    <label class="block text-[10px] sm:text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider dark-mode-label">Password</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 sm:pl-3.5 pointer-events-none text-slate-400 group-focus-within:text-slate-900 dark:group-focus-within:text-white transition-colors">
                            <svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                        <input type="password" name="password" id="login-password" required placeholder="••••••••" autocomplete="current-password"
                               class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl py-3 sm:py-2.5 pl-10 sm:pl-10 pr-10 sm:pr-10 text-sm sm:text-xs focus:outline-none focus:ring-2 focus:ring-slate-400 dark:focus:ring-slate-700 focus:border-slate-400 dark:focus:border-slate-700 transition-all placeholder-slate-400 dark:placeholder-slate-600 min-h-[44px] sm:min-h-[auto] dark-mode-input">
                        <button type="button" onclick="togglePasswordVisibility('login-password', this)" class="absolute inset-y-0 right-0 flex items-center pr-3.5 sm:pr-3.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors cursor-pointer z-10 bg-transparent border-0 p-0" style="background: transparent !important; border: none !important;">
                            <svg class="w-4 h-4 sm:w-4 sm:h-4 eye-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="w-4 h-4 sm:w-4 sm:h-4 eye-off-icon hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.574-2.59M5.22 5.22a10.05 10.05 0 012.59-1.574C8.667 2.943 10.268 2.5 12 2.5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 01-1.574 2.59M9.88 9.88a3 3 0 104.24 4.24M9.88 9.88L8.46 8.46M14.12 14.12l1.42 1.42M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 01-4.09 5.41M12 12l-3.59-3.59m0 0L12 12m0 0l3.59 3.59" />
                            </svg>
                        </button>
                    </div>
                </div>



                <button type="submit" class="w-full mt-2 sm:mt-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white shadow-lg shadow-indigo-500/30 border-none font-bold py-3.5 sm:py-3 px-4 sm:px-4 rounded-xl text-sm sm:text-xs transition cursor-pointer flex items-center justify-center gap-1.5 sm:gap-1.5 min-h-[48px] sm:min-h-[auto] active:scale-[0.98] sm:active:scale-100">
                    Login
                </button>
            </form>


        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const eyeIcon = button.querySelector('.eye-icon');
            const eyeOffIcon = button.querySelector('.eye-off-icon');
            
            if (input && input.type === 'password') {
                input.type = 'text';
                if (eyeIcon) eyeIcon.classList.add('hidden');
                if (eyeOffIcon) eyeOffIcon.classList.remove('hidden');
            } else if (input) {
                input.type = 'password';
                if (eyeIcon) eyeIcon.classList.remove('hidden');
                if (eyeOffIcon) eyeOffIcon.classList.add('hidden');
            }
        }

        function toggleTheme() {
            try {
                const html = document.documentElement;
                const body = document.body;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    body.classList.remove('dark'); // Fallback support
                    localStorage.setItem('theme', 'light');
                    console.log('Theme switched to light mode');
                } else {
                    html.classList.add('dark');
                    body.classList.add('dark'); // Fallback support
                    localStorage.setItem('theme', 'dark');
                    console.log('Theme switched to dark mode');
                }
                
                // Force update body background for immediate visual feedback
                if (html.classList.contains('dark')) {
                    body.style.backgroundColor = '#0b0f19';
                    body.style.color = '#f1f5f9';
                } else {
                    body.style.backgroundColor = '#f8fafc';
                    body.style.color = '#1e293b';
                }
            } catch (e) {
                console.error('Error toggling theme:', e);
            }
        }
        
        // Fallback: If Tailwind CSS fails to load, apply fallback classes
        window.addEventListener('load', function() {
            // Check if Tailwind loaded by testing if it created any styles
            setTimeout(function() {
                const hasTailwind = document.querySelector('style[data-tailwind]') || typeof tailwind !== 'undefined';
                if (!hasTailwind) {
                    console.log('Tailwind CSS not loaded, applying fallback styles');
                    document.body.classList.add('no-tailwind');
                    // Ensure current theme is applied with fallback classes
                    const isDark = document.documentElement.classList.contains('dark');
                    if (isDark) {
                        document.body.classList.add('dark');
                    } else {
                        document.body.classList.remove('dark');
                    }
                } else {
                    console.log('Tailwind CSS loaded successfully');
                }
            }, 1000);
        });
    </script>

</body>
</html>
