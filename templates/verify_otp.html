<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP - Sistem Pembayaran Internet</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="/static/Logo1.png">
    <script>
        window.tailwind = {
            config: {
                darkMode: 'class',
                theme: {
                    extend: {
                        keyframes: {
                            shimmer: {
                                '100%': { transform: 'translateX(100%)' }
                            }
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Logo1.png') }}">
    <script>
        // Set initial theme immediately with error handling
        (function() {
            try {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                console.log('Theme initialized:', savedTheme || 'system preference (' + prefersDark + ')');
            } catch (e) {
                console.error('Error initializing theme:', e);
                // Fallback to system preference if localStorage fails
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
        })();
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.6s ease-in-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="bg-[#f8fafc] dark:bg-[#0b0f19] text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden transition-colors duration-300 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-100/40 via-purple-50/20 to-white dark:from-indigo-900/20 dark:via-[#0b0f19] dark:to-[#0b0f19] animate-fade-in-up">

    <!-- Theme Toggle Floating Button -->
    <button onclick="toggleTheme()" class="absolute top-6 right-6 p-3 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-md hover:shadow-lg transition-all duration-300 hover:scale-105 cursor-pointer z-50 text-slate-600 dark:text-slate-300 relative" aria-label="Toggle Theme">
        <!-- Sun icon (visible in dark) -->
        <svg id="sun-icon" class="pointer-events-none w-4 h-4 hidden dark:block text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
        </svg>
        <!-- Moon icon (visible in light) -->
        <svg id="moon-icon" class="pointer-events-none w-4 h-4 block dark:hidden text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
    </button>

    <!-- Glowing Background Orbs (Modernized) -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-gradient-to-br from-indigo-500/20 to-purple-500/20 blur-[120px] animate-pulse" style="animation-duration: 8s;"></div>
        <div class="absolute -bottom-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-gradient-to-tl from-blue-500/20 to-cyan-500/20 blur-[120px] animate-pulse" style="animation-duration: 10s; animation-delay: 1s;"></div>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-md mx-auto bg-white/70 dark:bg-slate-900/60 backdrop-blur-2xl rounded-[2.5rem] shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] dark:shadow-[0_10px_40px_-10px_rgba(0,0,0,0.5)] border border-white/80 dark:border-slate-700/50 overflow-hidden transition-all duration-500 z-10 relative group">
        <!-- Subtle inner highlight -->
        <div class="absolute inset-0 bg-gradient-to-b from-white/40 to-transparent dark:from-white/5 dark:to-transparent opacity-50 rounded-[2.5rem] pointer-events-none"></div>
        
        <div class="p-8 sm:p-10 space-y-8 relative z-10">
            
            <!-- Icon & Header -->
            <div class="text-center space-y-5">
                <div class="flex justify-center items-center select-none animate-fade-in-up">
                    <div class="p-3 bg-gradient-to-br from-indigo-50 to-purple-50 dark:from-indigo-500/20 dark:to-purple-500/10 rounded-2xl border border-indigo-100 dark:border-indigo-500/20 shadow-sm inline-flex justify-center items-center transform transition-transform group-hover:scale-105 duration-500">
                        <img src="{{ url_for('static', filename='Logo1.png') }}" alt="Logo" class="h-12 w-auto object-contain drop-shadow-sm" style="height: 48px; width: auto;">
                    </div>
                </div>
                <div class="space-y-2 animate-fade-in-up" style="animation-delay: 0.1s;">
                    <h1 class="text-2xl sm:text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-600 dark:from-white dark:to-slate-300 tracking-tight">Verifikasi Keamanan</h1>
                    <p class="text-sm text-slate-500 dark:text-slate-400 font-medium leading-relaxed">Masukkan 6 digit kode OTP yang telah dikirimkan ke WhatsApp Anda.</p>
                </div>
            </div>

            <!-- Flash Error Message -->
            {% if error %}
            <div class="p-4 bg-rose-50/80 dark:bg-rose-900/30 backdrop-blur-sm border border-rose-200 dark:border-rose-800/50 text-rose-600 dark:text-rose-400 rounded-2xl text-sm font-semibold flex items-center gap-3 animate-shake shadow-sm">
                <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- OTP Form -->
            <form method="POST" action="/verify_otp" id="otp-form" class="space-y-8 animate-fade-in-up" style="animation-delay: 0.2s;" onsubmit="return submitOTPForm(this);">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <input type="hidden" name="otp" id="actual-otp-input" required pattern="[0-9]{6}">
                
                <div class="flex justify-between gap-2 sm:gap-3 dir-ltr">
                    <!-- 6 individual boxes for OTP -->
                    {% for i in range(6) %}
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
                           class="otp-box w-10 h-12 sm:w-14 sm:h-16 text-center font-mono font-bold text-2xl sm:text-3xl bg-white/60 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/80 rounded-xl sm:rounded-2xl shadow-sm focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/20 dark:focus:ring-indigo-500/30 text-slate-800 dark:text-white transition-all backdrop-blur-sm hover:border-slate-300 dark:hover:border-slate-600" 
                           {% if loop.first %}autofocus{% endif %}>
                    {% endfor %}
                </div>

                <button type="submit" id="submit-btn" class="w-full relative group overflow-hidden bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 border border-white/10 font-bold py-4 px-4 rounded-2xl text-sm transition-all duration-300 flex items-center justify-center gap-2 active:scale-[0.98]">
                    <span class="relative z-10 tracking-wide">Konfirmasi Login</span>
                    <svg class="w-5 h-5 relative z-10 transition-transform duration-300 group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                    <!-- Button shine effect -->
                    <div class="absolute inset-0 h-full w-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] z-0"></div>
                </button>
            </form>
            
        </div>
    </div>

    <!-- Theme toggle script & OTP logic -->
    <script>
        // OTP Logic
        document.addEventListener('DOMContentLoaded', () => {
            const boxes = document.querySelectorAll('.otp-box');
            const hiddenInput = document.getElementById('actual-otp-input');
            
            boxes.forEach((box, index) => {
                box.addEventListener('input', (e) => {
                    // Filter non-numeric
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    if (e.target.value !== '' && index < boxes.length - 1) {
                        boxes[index + 1].focus();
                    }
                    updateHiddenInput();
                });
                
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        boxes[index - 1].focus();
                    }
                });

                // Handle paste
                box.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const text = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                    if (!text) return;
                    
                    let curr = index;
                    for (let i = 0; i < text.length && curr < boxes.length; i++) {
                        boxes[curr].value = text[i];
                        if (curr < boxes.length - 1) boxes[curr + 1].focus();
                        curr++;
                    }
                    updateHiddenInput();
                });
            });

            function updateHiddenInput() {
                const val = Array.from(boxes).map(b => b.value).join('');
                hiddenInput.value = val;
            }
        });

        function submitOTPForm(form) {
            const hiddenInput = document.getElementById('actual-otp-input');
            if(hiddenInput.value.length < 6) {
                alert('Silakan lengkapi 6 digit kode OTP');
                return false;
            }
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = 'Memverifikasi...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            return true;
        }
        function toggleTheme() {
            try {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                    console.log('Theme switched to light mode');
                } else {
                    html.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    console.log('Theme switched to dark mode');
                }
            } catch (e) {
                console.error('Error toggling theme:', e);
            }
        }

        // Observer for theme changes to swap icons correctly
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'class') {
                    const isDark = document.documentElement.classList.contains('dark');
                    const sunIcon = document.getElementById('sun-icon');
                    const moonIcon = document.getElementById('moon-icon');
                    
                    if (sunIcon && moonIcon) {
                        if (isDark) {
                            sunIcon.classList.remove('hidden');
                            moonIcon.classList.add('hidden');
                        } else {
                            sunIcon.classList.add('hidden');
                            moonIcon.classList.remove('hidden');
                        }
                    }
                }
            });
        });
        
        observer.observe(document.documentElement, { attributes: true });


    </script>
</body>
</html>
